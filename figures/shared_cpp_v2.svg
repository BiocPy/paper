<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="448" fill="#ffffff"/>

  <!-- Column Headers -->
  <text x="172" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">1. Shared C++ Core</text>
  <text x="480" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">2. Language Bindings</text>
  <text x="735" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">3. User-Facing Tools</text>

  <!-- ==================== LEFT: SHARED C++ CORE ==================== -->
  <rect x="20" y="42" width="304" height="366" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.6" filter="url(#shadow)"/>

  <!-- C++ Badge & Title -->
  <g transform="translate(34, 54)">
    <polygon points="16,0 32,9 32,27 16,36 0,27 0,9" fill="#1e40af"/>
    <text x="16" y="22.5" text-anchor="middle" font-size="11.5" font-weight="800" fill="#ffffff">C++</text>
  </g>
  <text x="76" y="70" font-size="13.5" font-weight="700" fill="#0f172a">Single-Cell Libraries</text>
  <text x="76" y="85" font-size="10.2" fill="#475569">Implemented once, shared everywhere</text>

  <!-- Top Subcard: Core Analysis Libraries -->
  <rect x="34" y="100" width="276" height="208" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="119" font-size="11.2" font-weight="700" fill="#0f172a">Analysis Algorithms</text>

  <rect x="46" y="128" width="90" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.7"/>
  <text x="91" y="142" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1e40af">libscran</text>
  <text x="144" y="142" font-size="10" fill="#334155">QC, norm, HVGs, clustering</text>

  <rect x="46" y="153" width="90" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.7"/>
  <text x="91" y="167" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1e40af">irlba</text>
  <text x="144" y="167" font-size="10" fill="#334155">Approximate PCA</text>

  <rect x="46" y="178" width="90" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.7"/>
  <text x="91" y="192" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1e40af">mnncorrect</text>
  <text x="144" y="192" font-size="10" fill="#334155">MNN batch correction</text>

  <rect x="46" y="203" width="90" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.7"/>
  <text x="91" y="217" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1e40af">knncolle</text>
  <text x="144" y="217" font-size="10" fill="#334155">Nearest-neighbor search</text>

  <rect x="46" y="228" width="90" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.7"/>
  <text x="91" y="242" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1e40af">singlepp</text>
  <text x="144" y="242" font-size="10" fill="#334155">Cell type classification</text>

  <rect x="46" y="253" width="90" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.7"/>
  <text x="91" y="267" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1e40af">umappp</text>
  <text x="144" y="267" font-size="10" fill="#334155">UMAP embedding</text>

  <rect x="46" y="278" width="90" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.7"/>
  <text x="91" y="292" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1e40af">qdtsne</text>
  <text x="144" y="292" font-size="10" fill="#334155">Barnes-Hut t-SNE</text>

  <!-- Upward arrow from tatami base to Analysis Algorithms -->
  <line x1="172" y1="328" x2="172" y2="311" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- Base Subcard: tatami -->
  <rect x="34" y="328" width="276" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="46" y="347" font-size="11.8" font-weight="700" fill="#1e40af">tatami</text>
  <text x="90" y="347" font-size="10.5" font-weight="600" fill="#334155">Matrix Abstraction Library</text>
  <text x="46" y="365" font-size="9.8" fill="#334155">Uniform C++ interface over dense, sparse,</text>
  <text x="46" y="379" font-size="9.8" fill="#334155">HDF5 &amp; delayed arrays (zero-copy / chunked)</text>

  <!-- ==================== ROW 1: R / BIOCONDUCTOR ==================== -->
  <rect x="386" y="42" width="494" height="106" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" filter="url(#shadow)"/>
  <path d="M 396 42 L 392 42 Q 386 42 386 48 L 386 142 Q 386 148 392 148 L 396 148 Z" fill="#2563eb"/>
  <text x="404" y="61" font-size="10.5" font-weight="700" fill="#1e40af" letter-spacing="0.4">R / BIOCONDUCTOR</text>

  <!-- Binding -->
  <text x="480" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Rcpp</text>
  <text x="480" y="104" text-anchor="middle" font-size="10" fill="#475569">Wraps beachmat / tatami_r</text>
  <text x="480" y="118" text-anchor="middle" font-size="10" fill="#475569">pointers &amp; R S4 slots</text>

  <line x1="564" y1="98" x2="594" y2="98" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- Tools -->
  <rect x="618" y="72" width="66" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="651" y="87" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">scrapper</text>
  <rect x="690" y="72" width="96" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="738" y="87" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">BiocNeighbors</text>
  <rect x="792" y="72" width="60" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="822" y="87" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">SingleR</text>
  <text x="735" y="118" text-anchor="middle" font-size="10" fill="#475569">Consumes &amp; returns S4 SE / SCE objects</text>

  <!-- ==================== ROW 2: WEBASSEMBLY / JAVASCRIPT ==================== -->
  <rect x="386" y="172" width="494" height="106" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" filter="url(#shadow)"/>
  <path d="M 396 172 L 392 172 Q 386 172 386 178 L 386 272 Q 386 278 392 278 L 396 278 Z" fill="#2563eb"/>
  <text x="404" y="191" font-size="10.5" font-weight="700" fill="#1e40af" letter-spacing="0.4">WEBASSEMBLY / BROWSER</text>

  <!-- Binding -->
  <text x="480" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Emscripten</text>
  <text x="480" y="234" text-anchor="middle" font-size="10" fill="#475569">Compiles C++ to Wasm</text>
  <text x="480" y="248" text-anchor="middle" font-size="10" fill="#475569">with JS bindings</text>

  <line x1="564" y1="228" x2="594" y2="228" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- Tools -->
  <rect x="652" y="202" width="90" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="697" y="217" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">scran.js (npm)</text>
  <rect x="752" y="202" width="66" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="785" y="217" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">Kana</text>
  <text x="735" y="248" text-anchor="middle" font-size="10" fill="#475569">Zero-server client-side browser analysis</text>

  <!-- ==================== ROW 3: PYTHON / BIOCPY ==================== -->
  <rect x="386" y="302" width="494" height="106" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" filter="url(#shadow)"/>
  <path d="M 396 302 L 392 302 Q 386 302 386 308 L 386 402 Q 386 408 392 408 L 396 408 Z" fill="#2563eb"/>
  <text x="404" y="321" font-size="10.5" font-weight="700" fill="#1e40af" letter-spacing="0.4">PYTHON / BIOCPY</text>

  <!-- Binding -->
  <text x="480" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">pybind11</text>
  <text x="480" y="364" text-anchor="middle" font-size="10" fill="#475569">Wraps mattress / tatami_python</text>
  <text x="480" y="378" text-anchor="middle" font-size="10" fill="#475569">pointers &amp; BiocPy members</text>

  <line x1="564" y1="358" x2="594" y2="358" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- Tools -->
  <rect x="614" y="332" width="66" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="647" y="347" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">scranpy</text>
  <rect x="686" y="332" width="66" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="719" y="347" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">knncolle</text>
  <rect x="758" y="332" width="58" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="787" y="347" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">singler</text>
  <rect x="822" y="332" width="46" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="845" y="347" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">...</text>
  <text x="735" y="378" text-anchor="middle" font-size="10" fill="#475569">Consumes &amp; returns BiocPy SE / SCE objects</text>

  <!-- ==================== BRANCHING ARROWS FROM C++ CORE ==================== -->
  <path d="M 324 165 C 356 165, 354 95, 382 95" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <path d="M 324 225 L 382 225" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <path d="M 324 285 C 356 285, 354 355, 382 355" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
</svg>
